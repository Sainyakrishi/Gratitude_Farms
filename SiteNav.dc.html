<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"></link>
</helmet>
<nav style="position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(252,249,244,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid #e5e2dd;font-family:'Hanken Grotesk',sans-serif;">
  <div style="max-width:1440px;margin:0 auto;padding:16px 80px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;">
      <img src="assets/logo-badge.png" alt="Gratitude Farms logo" style="width:58px;height:58px;object-fit:contain;"/>
      <span style="font-family:'Source Serif 4',serif;font-size:25px;font-weight:700;color:#1A3C34;letter-spacing:-0.01em;">Gratitude Farms</span>
    </a>

    <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:36px;">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="6">
          <div style="position:relative;" onMouseEnter="{{ item.onEnter }}" onMouseLeave="{{ item.onLeave }}">
            <a href="{{ item.href }}" style="text-decoration:none;font-size:14px;font-weight:600;letter-spacing:0.02em;color:{{ item.color }};padding-bottom:4px;border-bottom:2px solid {{ item.borderColor }};white-space:nowrap;">{{ item.label }}</a>
            <sc-if value="{{ item.isOpen }}">
              <div style="position:absolute;top:100%;left:0;padding-top:14px;">
                <div style="background:#FAFAF9;border:1px solid #e5e2dd;border-radius:12px;box-shadow:0 12px 40px rgba(26,60,52,0.12);padding:10px;min-width:280px;display:flex;flex-direction:column;">
                  <sc-for list="{{ item.children }}" as="child" hint-placeholder-count="3">
                    <div style="position:relative;" onMouseEnter="{{ child.onEnter }}" onMouseLeave="{{ child.onLeave }}">
                      <a href="{{ child.href }}" style="text-decoration:none;color:{{ child.linkColor }};font-size:13.5px;font-weight:500;padding:11px 14px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:{{ child.linkBg }};" style-hover="background:#F5F2ED;color:#C5A059;">{{ child.label }}<sc-if value="{{ child.hasAudiences }}"><span style="color:#C5A059;font-size:16px;line-height:1;">›</span></sc-if></a>
                      <sc-if value="{{ child.isOpen }}">
                        <div style="position:absolute;top:-10px;left:100%;padding-left:8px;z-index:5;">
                          <div style="background:#FAFAF9;border:1px solid #e5e2dd;border-radius:12px;box-shadow:0 12px 40px rgba(26,60,52,0.15);padding:10px;min-width:250px;display:flex;flex-direction:column;">
                            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#717976;text-transform:uppercase;padding:6px 14px 8px;">By Target Audience</span>
                            <sc-for list="{{ child.audiences }}" as="aud" hint-placeholder-count="5">
                              <a href="{{ aud.href }}" style="text-decoration:none;color:#1A3C34;font-size:13px;font-weight:500;padding:10px 14px;border-radius:8px;" style-hover="background:#F5F2ED;color:#C5A059;">{{ aud.label }}</a>
                            </sc-for>
                          </div>
                        </div>
                      </sc-if>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <a href="Contact.dc.html" style="text-decoration:none;font-size:13px;font-weight:700;letter-spacing:0.04em;color:#fff;background:#1A3C34;padding:13px 26px;border-radius:10px;flex-shrink:0;" style-hover="background:#C5A059;color:#1A3C34;">Enquire Now</a>
    </sc-if>

    <sc-if value="{{ isMobile }}">
      <button onClick="{{ toggleMobile }}" aria-label="Menu" style="background:none;border:none;color:#1A3C34;cursor:pointer;padding:6px;display:flex;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ mobileOpen }}">
    <div style="background:#FAFAF9;border-top:1px solid #e5e2dd;max-height:80vh;overflow-y:auto;padding:12px 20px 28px;display:flex;flex-direction:column;">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="6">
        <div style="display:flex;flex-direction:column;border-bottom:1px solid #ebe8e3;">
          <a href="{{ item.href }}" style="text-decoration:none;color:#1A3C34;font-size:16px;font-weight:700;padding:16px 4px;">{{ item.label }}</a>
          <sc-for list="{{ item.children }}" as="child" hint-placeholder-count="0">
            <div style="display:flex;flex-direction:column;">
              <a href="{{ child.href }}" style="text-decoration:none;color:#414846;font-size:14px;font-weight:600;padding:8px 4px 8px 16px;">{{ child.label }}</a>
              <sc-for list="{{ child.audiences }}" as="aud" hint-placeholder-count="0">
                <a href="{{ aud.href }}" style="text-decoration:none;color:#717976;font-size:12.5px;font-weight:500;padding:5px 4px 5px 32px;">{{ aud.label }}</a>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <a href="Contact.dc.html" style="text-decoration:none;text-align:center;font-size:14px;font-weight:700;color:#fff;background:#1A3C34;padding:14px 26px;border-radius:10px;margin-top:20px;">Enquire Now</a>
    </div>
  </sc-if>
</nav>
<div style="height:70px;"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: false, mobileOpen: false, openDropdown: null, openSub: null };

  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 980px)');
    const update = () => this.setState({ isMobile: this.mq.matches, mobileOpen: false });
    update();
    this.mq.addEventListener('change', update);
  }
  componentWillUnmount() {
    if (this.mq) this.mq.removeEventListener('change', () => {});
  }

  renderVals() {
    const active = this.props.active ?? '';
    const raw = [
      { key: 'home', label: 'Home', href: 'Home.dc.html' },
      { key: 'about', label: 'About Us', href: 'About-Us.dc.html', children: [
        { label: 'About Gratitude Farms', href: 'About-Us.dc.html' },
        { label: 'About Team', href: 'Our-Team.dc.html' }
      ]},
      { key: 'program', label: 'Our Services', href: 'Our-Services.dc.html', children: [
        { label: 'Managed Farmland Service', href: 'Managed-Farmland.dc.html' },
        { label: 'Soil Fertility Service (BhuPrana™)', href: 'Soil-Fertility-BhuPrana.dc.html' },
        { label: 'Farmland Design Service (Vasudha™)', href: 'Farmland-Design-Vasudha.dc.html' },
        { label: 'Farmland Operate Service (Sanjeevani™)', href: 'Farmland-Operate-Sanjeevani.dc.html' }
      ]},
      { key: 'sainya', label: 'Sainya Krishi', href: 'Sainya-Krishi.dc.html' },
      { key: 'medicinal', label: 'Medicinal Plants & Trees', href: 'Medicinal-Plants-Trees.dc.html', children: [
        { label: 'About Vriksh Ayurveda', href: 'Vriksh-Ayurveda.dc.html' }
      ]},
      { key: 'blog', label: 'Blogs', href: 'Blog.dc.html' },
      { key: 'contact', label: 'Contact', href: 'Contact.dc.html' }
    ];
    const audienceDefs = [
      ['individuals', 'Individuals / NRIs'],
      ['corporates', 'Corporates & PSUs'],
      ['fpos', 'FPOs / Village Orgs'],
      ['small', 'Small Landholders'],
      ['marginal', 'Small & Marginal Holders']
    ];
    const navItems = raw.map(item => ({
      ...item,
      color: active === item.key ? '#C5A059' : '#1A3C34',
      borderColor: active === item.key ? '#C5A059' : 'transparent',
      isOpen: this.state.openDropdown === item.key,
      onEnter: () => item.children && this.setState({ openDropdown: item.key }),
      onLeave: () => item.children && this.setState({ openDropdown: null, openSub: null }),
      children: (item.children || []).map(child => {
        const hasAudiences = item.key === 'program';
        return {
          ...child,
          hasAudiences,
          audiences: hasAudiences ? audienceDefs.map(([k, l]) => ({ label: l, href: `${child.href}?audience=${k}` })) : [],
          isOpen: this.state.openSub === child.href,
          linkColor: this.state.openSub === child.href ? '#C5A059' : '#1A3C34',
          linkBg: this.state.openSub === child.href ? '#F5F2ED' : 'transparent',
          onEnter: () => hasAudiences && this.setState({ openSub: child.href }),
          onLeave: () => {}
        };
      })
    }));
    return {
      navItems,
      isMobile: this.state.isMobile,
      mobileOpen: this.state.mobileOpen,
      toggleMobile: () => this.setState(s => ({ mobileOpen: !s.mobileOpen }))
    };
  }
}
</script>
</body>
</html>
