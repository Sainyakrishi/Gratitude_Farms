<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="stylesheet" href="./site.css">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"></link>
</helmet>
<nav class="{{ navClass }}" style="position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(252,249,244,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid #e5e2dd;font-family:'Hanken Grotesk',sans-serif;">
  <div style="max-width:1440px;margin:0 auto;padding:14px clamp(20px,5.5vw,80px);display:flex;align-items:center;justify-content:space-between;gap:24px;">
    <a href="Home.dc.html" aria-label="Gratitude Farms home" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;">
      <img src="assets/logo-badge.png" alt="" style="width:{{ logoSize }};height:{{ logoSize }};object-fit:contain;"/>
      <span style="font-family:'Source Serif 4',serif;font-size:{{ titleSize }};font-weight:700;color:#1A3C34;letter-spacing:-0.01em;white-space:nowrap;">Gratitude Farms</span>
    </a>

    <sc-if value="{{ !isMobile }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:clamp(16px,2vw,32px);">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="7">
          <div style="position:relative;" onMouseEnter="{{ item.onEnter }}" onMouseLeave="{{ item.onLeave }}" onBlur="{{ item.onBlur }}" onKeyDown="{{ onEscape }}">
            <a href="{{ item.href }}" aria-expanded="{{ item.ariaExpanded }}" onFocus="{{ item.onEnter }}" style="text-decoration:none;font-size:14px;font-weight:600;letter-spacing:0.02em;color:{{ item.color }};padding-bottom:4px;border-bottom:2px solid {{ item.borderColor }};white-space:nowrap;display:inline-flex;align-items:center;gap:6px;">{{ item.label }}<sc-if value="{{ item.hasChildren }}"><span aria-hidden="true" style="font-size:9px;opacity:0.65;">▼</span></sc-if></a>
            <sc-if value="{{ item.isOpen }}">
              <div style="position:absolute;top:100%;left:0;padding-top:14px;">
                <div class="gf-nav-panel" style="background:#FAFAF9;border:1px solid #e5e2dd;border-radius:12px;box-shadow:0 12px 40px rgba(26,60,52,0.14);padding:10px;min-width:300px;display:flex;flex-direction:column;">
                  <sc-for list="{{ item.children }}" as="child" hint-placeholder-count="4">
                    <div style="position:relative;" onMouseEnter="{{ child.onEnter }}" onMouseLeave="{{ child.onLeave }}">
                      <sc-if value="{{ child.groupLabel }}">
                        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#717976;text-transform:uppercase;padding:12px 14px 6px;display:block;">{{ child.groupLabel }}</span>
                      </sc-if>
                      <a href="{{ child.href }}" onFocus="{{ child.onEnter }}" style="text-decoration:none;color:{{ child.linkColor }};font-size:13.5px;font-weight:500;padding:11px 14px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:{{ child.linkBg }};" style-hover="background:#F5F2ED;color:#C5A059;">{{ child.label }}<sc-if value="{{ child.hasAudiences }}"><span aria-hidden="true" style="color:#C5A059;font-size:16px;line-height:1;">›</span></sc-if></a>
                      <sc-if value="{{ child.isOpen }}">
                        <div style="position:absolute;top:-10px;left:100%;padding-left:8px;z-index:5;">
                          <div class="gf-nav-panel" style="background:#FAFAF9;border:1px solid #e5e2dd;border-radius:12px;box-shadow:0 12px 40px rgba(26,60,52,0.15);padding:10px;min-width:250px;display:flex;flex-direction:column;">
                            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#717976;text-transform:uppercase;padding:6px 14px 8px;">By Target Audience</span>
                            <sc-for list="{{ child.audiences }}" as="aud" hint-placeholder-count="5">
                              <a href="{{ aud.href }}" style="text-decoration:none;color:#1A3C34;font-size:13px;font-weight:500;padding:10px 14px;border-radius:8px;" style-hover="background:#F5F2ED;color:#C5A059;">{{ aud.label }}</a>
                            </sc-for>
                          </div>
                        </div>
                      </sc-if>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <a href="Contact.dc.html" style="text-decoration:none;font-size:13px;font-weight:700;letter-spacing:0.04em;color:#fff;background:#1A3C34;padding:13px 26px;border-radius:10px;flex-shrink:0;white-space:nowrap;" style-hover="background:#C5A059;color:#1A3C34;">Enquire Now</a>
    </sc-if>

    <sc-if value="{{ isMobile }}">
      <button onClick="{{ toggleMobile }}" aria-label="{{ menuLabel }}" aria-expanded="{{ mobileExpanded }}" style="background:none;border:none;color:#1A3C34;cursor:pointer;padding:6px;display:flex;">
        <sc-if value="{{ !mobileOpen }}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </sc-if>
        <sc-if value="{{ mobileOpen }}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
        </sc-if>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ mobileOpen }}">
    <div class="gf-mobile-panel" style="background:#FAFAF9;border-top:1px solid #e5e2dd;padding:8px 20px 28px;display:flex;flex-direction:column;">
      <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="7">
        <div style="display:flex;flex-direction:column;border-bottom:1px solid #ebe8e3;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <a href="{{ item.href }}" onClick="{{ closeMobile }}" style="text-decoration:none;color:{{ item.color }};font-size:16px;font-weight:700;padding:15px 4px;flex:1;">{{ item.label }}</a>
            <sc-if value="{{ item.hasChildren }}">
              <button onClick="{{ item.onToggleMobile }}" aria-label="Show {{ item.label }} links" aria-expanded="{{ item.ariaExpanded }}" style="background:none;border:none;color:#717976;font-size:13px;cursor:pointer;padding:12px;line-height:1;">{{ item.mobileIcon }}</button>
            </sc-if>
          </div>
          <sc-if value="{{ item.isOpen }}">
            <div style="display:flex;flex-direction:column;padding-bottom:10px;">
              <sc-for list="{{ item.children }}" as="child" hint-placeholder-count="0">
                <div style="display:flex;flex-direction:column;">
                  <sc-if value="{{ child.groupLabel }}">
                    <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:#717976;text-transform:uppercase;padding:12px 4px 4px 16px;">{{ child.groupLabel }}</span>
                  </sc-if>
                  <a href="{{ child.href }}" onClick="{{ closeMobile }}" style="text-decoration:none;color:#414846;font-size:14.5px;font-weight:600;padding:9px 4px 9px 16px;">{{ child.label }}</a>
                  <sc-for list="{{ child.audiences }}" as="aud" hint-placeholder-count="0">
                    <a href="{{ aud.href }}" onClick="{{ closeMobile }}" style="text-decoration:none;color:#717976;font-size:12.5px;font-weight:500;padding:6px 4px 6px 32px;">{{ aud.label }}</a>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
      <a href="Contact.dc.html" onClick="{{ closeMobile }}" style="text-decoration:none;text-align:center;font-size:14px;font-weight:700;color:#fff;background:#1A3C34;padding:15px 26px;border-radius:10px;margin-top:20px;">Enquire Now</a>
    </div>
  </sc-if>
</nav>
<div class="gf-nav-spacer"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { isMobile: false, mobileOpen: false, openDropdown: null, openSub: null, scrolled: false };

  // The site's page graph lives here. SiteFooter builds its sitemap from the
  // same shape, so a new page only has to be added in one place.
  navDef = [
    { key: 'home', label: 'Home', href: 'Home.dc.html' },
    { key: 'about', label: 'About Us', href: 'About-Us.dc.html', children: [
      { label: 'About Gratitude Farms', href: 'About-Us.dc.html' },
      { label: 'Our Team', href: 'Our-Team.dc.html' }
    ]},
    { key: 'program', label: 'Our Services', href: 'Our-Services.dc.html', children: [
      { group: 'Services', label: 'Managed Farmland Service', href: 'Managed-Farmland.dc.html', audiences: true },
      { group: 'Services', label: 'Soil Fertility (BhuPrana™)', href: 'Soil-Fertility-BhuPrana.dc.html', audiences: true },
      { group: 'Services', label: 'Farmland Design (Vasudha™)', href: 'Farmland-Design-Vasudha.dc.html', audiences: true },
      { group: 'Services', label: 'Farmland Operate (Sanjeevani™)', href: 'Farmland-Operate-Sanjeevani.dc.html', audiences: true },
      { group: 'Programs', label: 'Farmland Development Projects', href: 'Farmland-Development.dc.html' },
      { group: 'Programs', label: 'Personal Nakshatra Vanam', href: 'Nakshatra-Vanam.dc.html' },
      { group: 'Programs', label: 'Corporate ESG Projects', href: 'Corporate-ESG.dc.html' }
    ]},
    { key: 'sainya', label: 'Sainya Krishi', href: 'Sainya-Krishi.dc.html' },
    { key: 'medicinal', label: 'Medicinal Plants & Trees', href: 'Medicinal-Plants-Trees.dc.html', children: [
      { label: 'Medicinal Plants & Trees', href: 'Medicinal-Plants-Trees.dc.html' },
      { label: 'About Vriksh Ayurveda', href: 'Vriksh-Ayurveda.dc.html' }
    ]},
    { key: 'blog', label: 'Blogs', href: 'Blog.dc.html' },
    { key: 'contact', label: 'Contact', href: 'Contact.dc.html' }
  ];

  audienceDefs = [
    ['individuals', 'Individuals / NRIs'],
    ['corporates', 'Corporates & PSUs'],
    ['fpos', 'FPOs / Village Orgs'],
    ['small', 'Small Landholders'],
    ['marginal', 'Small & Marginal Holders']
  ];

  componentDidMount() {
    this.mq = window.matchMedia('(max-width: 980px)');
    // Named handler, so componentWillUnmount can actually detach it.
    this.onMq = () => this.setState({ isMobile: this.mq.matches, mobileOpen: false, openDropdown: null, openSub: null });
    this.onMq();
    this.mq.addEventListener('change', this.onMq);

    this.onScroll = () => {
      const scrolled = window.scrollY > 8;
      if (scrolled !== this.state.scrolled) this.setState({ scrolled });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
  }

  componentWillUnmount() {
    if (this.mq && this.onMq) this.mq.removeEventListener('change', this.onMq);
    if (this.onScroll) window.removeEventListener('scroll', this.onScroll);
    document.body.style.overflow = '';
  }

  setMobileOpen(open) {
    this.setState({ mobileOpen: open, openDropdown: open ? this.state.openDropdown : null });
    // Stop the page behind the drawer from scrolling with it.
    document.body.style.overflow = open ? 'hidden' : '';
  }

  renderVals() {
    const active = this.props.active ?? '';
    const isMobile = this.state.isMobile;

    const navItems = this.navDef.map(item => {
      const kids = item.children || [];
      let lastGroup = null;
      const children = kids.map(child => {
        const groupLabel = child.group && child.group !== lastGroup ? child.group : '';
        lastGroup = child.group || lastGroup;
        const hasAudiences = !!child.audiences;
        return {
          label: child.label,
          href: child.href,
          groupLabel,
          hasAudiences,
          audiences: hasAudiences
            ? this.audienceDefs.map(([k, l]) => ({ label: l, href: `${child.href}?audience=${k}` }))
            : [],
          isOpen: !isMobile && this.state.openSub === child.href,
          linkColor: this.state.openSub === child.href ? '#C5A059' : '#1A3C34',
          linkBg: this.state.openSub === child.href ? '#F5F2ED' : 'transparent',
          onEnter: () => hasAudiences && !isMobile && this.setState({ openSub: child.href }),
          onLeave: () => {}
        };
      });

      const isOpen = this.state.openDropdown === item.key;
      return {
        key: item.key,
        label: item.label,
        href: item.href,
        children,
        hasChildren: kids.length > 0,
        isOpen,
        ariaExpanded: kids.length ? String(isOpen) : undefined,
        mobileIcon: isOpen ? '▲' : '▼',
        color: active === item.key ? '#C5A059' : '#1A3C34',
        borderColor: active === item.key ? '#C5A059' : 'transparent',
        onEnter: () => kids.length && !isMobile && this.setState({ openDropdown: item.key }),
        onLeave: () => kids.length && !isMobile && this.setState({ openDropdown: null, openSub: null }),
        // Keyboard users tab through the menu; close it only once focus has
        // genuinely left the item, not while moving between its own links.
        onBlur: (e) => {
          if (isMobile) return;
          const next = e.relatedTarget;
          if (next && e.currentTarget.contains(next)) return;
          this.setState({ openDropdown: null, openSub: null });
        },
        onToggleMobile: () => this.setState(s => ({
          openDropdown: s.openDropdown === item.key ? null : item.key
        }))
      };
    });

    return {
      navItems,
      isMobile,
      mobileOpen: this.state.mobileOpen,
      mobileExpanded: String(this.state.mobileOpen),
      menuLabel: this.state.mobileOpen ? 'Close menu' : 'Open menu',
      navClass: this.state.scrolled ? 'gf-nav-scrolled' : '',
      logoSize: isMobile ? '40px' : '52px',
      titleSize: isMobile ? '19px' : '24px',
      toggleMobile: () => this.setMobileOpen(!this.state.mobileOpen),
      closeMobile: () => this.setMobileOpen(false),
      onEscape: (e) => { if (e.key === 'Escape') this.setState({ openDropdown: null, openSub: null }); }
    };
  }
}
</script>
</body>
</html>
