<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;background:#FAFAF9;border:1px solid #e5e2dd;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(26,60,52,0.05);">
  <div style="width:100%;aspect-ratio:1;overflow:hidden;background:#EBE8E3;">
    <img src="{{ person.photo }}" alt="{{ person.name }}" style="width:100%;height:100%;object-fit:cover;object-position:top center;"/>
  </div>
  <div style="padding:20px 22px 24px;display:flex;flex-direction:column;gap:4px;">
    <div style="font-family:'Source Serif 4',serif;font-size:19px;font-weight:700;color:#1A3C34;">{{ person.name }}</div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.04em;color:#C5A059;text-transform:uppercase;">{{ person.role }}</div>
    <sc-if value="{{ person.bio }}">
      <p style="color:#414846;font-size:13.5px;line-height:1.6;margin:8px 0 0;">{{ person.bio }}</p>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:360},&quot;person&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string,role:string,photo:string,bio?:string}&quot;}}"></script>
</body>
</html>
